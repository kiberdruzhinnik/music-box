services:
  go-sb2p:
    build:
      context: .
    image: local/go-singbox2proxy:1.0.0
    container_name: go-singbox2proxy
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SOCKS5_PORT:-1080}:1080/tcp"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080/tcp"
